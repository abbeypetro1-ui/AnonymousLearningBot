<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LearningAnonymousBot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span id="botEmoji" class="emoji"></span>
        <div>
          <h1 id="botName"></h1>
          <p id="botTagline"></p>
        </div>
      </div>
      <div class="actions">
        <label class="style-picker">
          <span class="sr-only">Learning style</span>
          <select id="styleSelect" title="How do you like to learn?"></select>
        </label>
        <button id="materialBtn" type="button">📚 Material</button>
        <button id="keyBtn" type="button">🔑 API key</button>
        <button id="newChatBtn" type="button">New chat</button>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite"></main>

    <div id="starters" class="starters"></div>

    <div class="composer">
      <textarea id="input" rows="1" placeholder="Type your message... (Enter to send, Shift+Enter for a new line)"></textarea>
      <button id="sendBtn" type="button" class="send">Send</button>
    </div>
  </div>

  <!-- API key pop-up -->
  <dialog id="keyDialog">
    <h2>Your Gemini API key</h2>
    <p>Paste your key here. It is never saved in the website's code.</p>
    <input id="keyInput" type="password" placeholder="Paste key here" autocomplete="off" />
    <label class="check">
      <input id="rememberKey" type="checkbox" /> Remember on this device
    </label>
    <div class="dialog-buttons">
      <button id="keyRemove" type="button" class="secondary">Remove key</button>
      <button id="keyCancel" type="button" class="secondary">Cancel</button>
      <button id="keySave" type="button">Save</button>
    </div>
  </dialog>

  <!-- Study material pop-up -->
  <dialog id="materialDialog">
    <h2>Study material</h2>
    <p>Paste notes, a handout, or a chapter summary. LearningAnonymousBot will use it for study guides and trivia. It stays in your browser only.</p>
    <textarea id="materialInput" rows="10" placeholder="Paste your material here..."></textarea>
    <label class="check">
      <input id="rememberMaterial" type="checkbox" /> Remember on this device
    </label>
    <div class="dialog-buttons">
      <button id="materialClear" type="button" class="secondary">Clear</button>
      <button id="materialCancel" type="button" class="secondary">Cancel</button>
      <button id="materialSave" type="button">Save</button>
    </div>
  </dialog>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
